<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 MQTT Dashboard</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 24px 16px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #58a6ff;
      letter-spacing: 0.5px;
    }

    header h1 span {
      color: #e6edf3;
      font-weight: 400;
    }

    .broker-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 24px;
      padding: 6px 14px;
      font-size: 0.85rem;
    }

    .broker-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f85149;
      transition: background 0.4s;
    }

    .broker-dot.online { background: #3fb950; box-shadow: 0 0 8px #3fb950aa; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    /* ── Sensor Card ── */
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px #00000066; }

    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
      transition: color 0.3s;
    }

    .card-unit { font-size: 0.85rem; color: #8b949e; margin-bottom: 16px; }

    /* Progress bar */
    .progress-track {
      background: #21262d;
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 8px;
      width: 0%;
      transition: width 0.5s ease;
    }

    /* Color variants */
    .blue  .card-value { color: #58a6ff; }
    .blue  .progress-fill { background: linear-gradient(90deg, #1f6feb, #58a6ff); }

    .purple .card-value { color: #bc8cff; }
    .purple .progress-fill { background: linear-gradient(90deg, #6e40c9, #bc8cff); }

    .orange .card-value { color: #f0883e; }
    .orange .progress-fill { background: linear-gradient(90deg, #bd561d, #f0883e); }

    .red    .card-value { color: #f85149; }
    .red    .progress-fill { background: linear-gradient(90deg, #b91c1c, #f85149); }

    /* ── LED Section ── */
    .led-section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 28px;
    }

    .led-indicator {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #21262d;
      border: 3px solid #30363d;
      flex-shrink: 0;
      transition: background 0.4s, box-shadow 0.4s, border-color 0.4s;
    }

    .led-indicator.on {
      background: #ffd60a;
      border-color: #e9b50b;
      box-shadow: 0 0 24px #ffd60a99, 0 0 8px #ffd60a;
    }

    .led-info { flex: 1; min-width: 140px; }

    .led-info h2 { font-size: 1.1rem; margin-bottom: 6px; }

    .led-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      background: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
      transition: all 0.3s;
    }

    .led-badge.on {
      background: #ffd60a22;
      color: #ffd60a;
      border-color: #ffd60a55;
    }

    .led-controls { display: flex; gap: 12px; }

    button {
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.15s;
    }

    button:hover { opacity: 0.85; transform: scale(1.03); }
    button:active { transform: scale(0.97); }

    .btn-on  { background: #3fb950; color: #0d1117; }
    .btn-off { background: #f85149; color: #fff; }

    /* ── Timestamp ── */
    .timestamp {
      text-align: right;
      font-size: 0.78rem;
      color: #484f58;
    }

    #last-update { font-style: italic; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>ESP32 <span>MQTT Dashboard</span></h1>
    <div class="broker-badge">
      <div class="broker-dot" id="broker-dot"></div>
      <span id="broker-label">Desconectado</span>
    </div>
  </header>

  <!-- Sensor cards -->
  <div class="grid">

    <div class="card blue" id="card-pot1">
      <div class="card-label">Potenciómetro 1</div>
      <div class="card-value" id="val-pot1">—</div>
      <div class="card-unit">Voltios (V)</div>
      <div class="progress-track"><div class="progress-fill" id="bar-pot1"></div></div>
    </div>

    <div class="card purple" id="card-pot2">
      <div class="card-label">Potenciómetro 2</div>
      <div class="card-value" id="val-pot2">—</div>
      <div class="card-unit">Voltios (V)</div>
      <div class="progress-track"><div class="progress-fill" id="bar-pot2"></div></div>
    </div>

    <div class="card orange" id="card-pot3">
      <div class="card-label">Potenciómetro 3</div>
      <div class="card-value" id="val-pot3">—</div>
      <div class="card-unit">Voltios (V)</div>
      <div class="progress-track"><div class="progress-fill" id="bar-pot3"></div></div>
    </div>

    <div class="card red" id="card-lm35">
      <div class="card-label">Temperatura LM35</div>
      <div class="card-value" id="val-lm35">—</div>
      <div class="card-unit">Grados Celsius (°C)</div>
      <div class="progress-track"><div class="progress-fill" id="bar-lm35"></div></div>
    </div>

  </div>

  <!-- LED control -->
  <div class="led-section">
    <div class="led-indicator" id="led-indicator"></div>
    <div class="led-info">
      <h2>Control LED</h2>
      <span class="led-badge" id="led-badge">DESCONOCIDO</span>
    </div>
    <div class="led-controls">
      <button class="btn-on"  onclick="sendLed('ON')">Encender</button>
      <button class="btn-off" onclick="sendLed('OFF')">Apagar</button>
    </div>
  </div>

  <!-- Timestamp -->
  <div class="timestamp">Última actualización: <span id="last-update">—</span></div>

  <script>
    const socket = io();

    // ── Broker status ──────────────────────────────────────────
    socket.on("broker_status", ({ connected }) => {
      const dot   = document.getElementById("broker-dot");
      const label = document.getElementById("broker-label");
      if (connected) {
        dot.classList.add("online");
        label.textContent = "Broker conectado";
      } else {
        dot.classList.remove("online");
        label.textContent = "Desconectado";
      }
    });

    // ── MQTT messages ──────────────────────────────────────────
    socket.on("mqtt_message", ({ topic, payload }) => {
      const val = parseFloat(payload);

      switch (topic) {
        case "pot/uno":
          updateSensor("pot1", val, 0, 3.3, 2);
          break;
        case "pot/dos":
          updateSensor("pot2", val, 0, 3.3, 2);
          break;
        case "pot/tres":
          updateSensor("pot3", val, 0, 3.3, 2);
          break;
        case "LM35/uno":
          updateSensor("lm35", val, 0, 100, 1);
          break;
        case "led/estado":
          updateLed(payload.trim().toUpperCase());
          break;
      }

      document.getElementById("last-update").textContent = new Date().toLocaleTimeString("es-ES");
    });

    // ── Helpers ────────────────────────────────────────────────
    function updateSensor(id, value, min, max, decimals) {
      if (isNaN(value)) return;
      const pct = Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100));
      document.getElementById(`val-${id}`).textContent = value.toFixed(decimals);
      document.getElementById(`bar-${id}`).style.width  = pct + "%";
    }

    function updateLed(state) {
      const indicator = document.getElementById("led-indicator");
      const badge     = document.getElementById("led-badge");
      if (state === "ON") {
        indicator.classList.add("on");
        badge.classList.add("on");
        badge.textContent = "ON";
      } else {
        indicator.classList.remove("on");
        badge.classList.remove("on");
        badge.textContent = "OFF";
      }
    }

    function sendLed(command) {
      socket.emit("led_command", { command });
    }
  </script>
</body>
</html>
